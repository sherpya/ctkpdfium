[project]
name = "ctkpdfium"
description = "An asynchronous, virtualized PDF viewer and image placement widget for CustomTkinter"
readme = "README.md"
authors = [
    { name = "Gianluigi Tiesi", email = "sherpya@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.11"
keywords = ["customtkinter", "pdf", "pdfium", "pypdfium2", "tkinter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Typing :: Typed",
]
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
]

[project.urls]
Homepage = "https://github.com/sherpya/ctkpdfium"
Repository = "https://github.com/sherpya/ctkpdfium"
Issues = "https://github.com/sherpya/ctkpdfium/issues"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/ctkpdfium"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/uv.lock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]

[[tool.mypy.overrides]]
module = ["customtkinter", "pypdfium2"]
ignore_missing_imports = true
